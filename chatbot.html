<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title> <!--React is an external library-->
  </head>
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script> <!--an external library loaded into our local file-->
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel"> 

        function ChatInput(){ //component and component syntax
            return (
            <> {/* This is called fragment. to remove the div cause it will show extra div on inspect element  */}
                <input placeholder="Type your message" size ="30" /> {/* Self-imposing component*/}
                <button> Send </button>
            </>)
        };

        function ChatMessage({ message, sender }){ {/* Components are reusable, add props*/}
            {/* deconstruct into a simpler code*/} {/* const message = props.message; */}
            {/* lets use desrtucturing*/}{/*const sender = props.sender; */}

            //const {message, sender} = props;  this has also been destructred to fit as one parameter in the function

            /* if(sender === "user"){ we use && in place of if

            return(
                <div>
                    {message}
                    <img src="user.png" width="50"/>
                </div>
            )
        }; */

         return(
                <div>
                    
                    {sender === "robot" && <img src ="robot.png" width="50" />}
                    {message}
                    {sender ==="user" && <img src="user.png" width="50"/>}
                    
                </div>
            )};

       
       function App(){ //advisable to keep components in a function and not a variable
        return(
            <>
               {/*ChatInput()*/}
               <ChatInput /> 
               <ChatMessage message="hello Chatbot" sender="user" />
               <ChatMessage message="hello how can i help?" sender="robot" />
               <ChatMessage message="Can you get me today's date?" sender="user"/>
               <ChatMessage message="Today is September 27th." sender="robot"/>
            </>
        );}

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />); //render only displays one argument
    </script>
  </body>
</html>
