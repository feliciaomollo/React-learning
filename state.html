<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

//use state to save data that changes overtime
      function ChatInput(chatMessages, sendChatmessages) {
        const[inputText, setInputText] = React.useState('');
        function saveInputText(event){
            setInputText(event.target.value);
        }

        function sendMessage(){
           setChatMessages([// using the spread operator, we will copy the contents of chatMessages since we do not modify directly
                ...chatMessages, //we made copy of the chat messages array
                {
                    message: "Hello Guys",
                    sender: "user",
                    id: crypto.randomUUID()
                }
            ]);
        };
        return (
          <>
            <input
              placeholder="Type your message"
              size="30"
              onChange ={saveInputText}
            />
            <button onClick ={sendMessage}>Send</button>
          </>
        );
      }


      function ChatMessage({ message, sender }) {
        return (
          <div>

            {sender === "robot" && (
              <img src="robot.png" width="50" />
            )}

            {message}

            {sender === "user" && (
              <img src="user.png" width="50" />
            )}

          </div>
        );
      }


      function ChatMessages({chatMessages}) {

        //const chatMessages = array[0]; //the current data
        //const setChatMessages = array[1]; //function that updates data in the first array known as the updater function
        
        //const [chatMessages, setChatMessages] = array; //array destructuring. order matters for first and second value

        /* function sendMessage(){
            setChatMessages([// using the spread operator, we will copy the contents of chatMessages since we do not modify directly
                ...chatMessages, //we made copy of the chat messages array
                {
                    message: "Hello Guys",
                    sender: "user",
                    id: crypto.randomUUID()
                }
            ]);
        } 
            <button onClick={sendMessage}> Send Message</button> This was under return*/

        return (
          <>
              {chatMessages.map((chatMessage) => {
                return (
                  <ChatMessage
                    message={chatMessage.message}
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                  />
                );
              })}
          </>
        );
      }


      function App() {
        const [chatMessages, setChatMessages] = React.useState( //gives us two values set and array when generating the html
            [
                {
                    message: "hello Chatbot",
                    sender: "user",
                    id: "id1"
                },
                {
                    message: "hello how can i help?",
                    sender: "robot",
                    id: "id2"
                },
                {
                    message: "Can you get me today's date?",
                    sender: "user",
                    id: "id3"
                },
                {
                    message: "Today is September 27th.",
                    sender: "robot",
                    id: "id4"
                }
            ]
        );
        return (
          <>
            <ChatInput 
                chatMessages={chatMessages} //saving an array inside a prop
                setChatMessages ={setChatMessages}
            />
            <ChatMessages 
              chatMessages={chatMessages} //consider the naming convention
            />
          </>
        );
      }


      const container = document.querySelector(".js-container");

      ReactDOM.createRoot(container).render(<App />);

    </script>
  </body>
</html>
