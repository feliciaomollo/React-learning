<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
        body{
          font-family: arial;
          margin-top: 0px;
          margin-bottom: 0px;
        }
        .send-button{
            background-color: rgb(25, 138, 71);
            color: white;
            padding: 10px 10px;
            border-radius: 10px;
            border: 0;
            margin-left: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        .chat-input{
            padding: 10px 15px;
            border-radius: 10px;
            border-width: 1px;
            margin-bottom: 60px;

            flex-grow: 1; 
        }
        .chatinput-container{
          display: flex; /*preventing it from growing larger than the specified value while allowing it to shrink dynamically on smaller screens. */
        }
        .app-container{
          max-width: 600px; /* preventing it from growing larger than the specified value while allowing it to shrink dynamically on smaller screens. */
          margin: auto;

          height: 100vh;
          display:flex;
          flex-direction: column;
        }
        .chat-message-user{
          display: flex;
          justify-content: end;
          align-items: start;
        }
        .chat-message-robot{
          display: flex;
          justify-content: start;
          align-items: start;
        }
        .chat-message-text{
          background-color:aliceblue;
          padding: 15px 20px;
          border-radius: 10px;
          margin-right: 10px;
          margin-left:10px;
          margin-bottom: 20px;
          max-width: 300px;
        }
        .chat-message-profile{
          width: 50px;
        }
        .chat-messages-container{
          flex-grow:1;
          margin-top: 20px;
          overflow: scroll;
          scrollbar-width: none;
        }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src ="https://unpkg.com/supersimpledev/chatbot.js"> </script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">


      function ChatInput({ chatMessages, setChatMessages }) {
        const[inputText, setInputText] = React.useState('');
        function saveInputText(event){
            setInputText(event.target.value);
        }

        function sendMessage(){
          const newChatMessages =[
              ...chatMessages, 
                {
                    message: inputText,
                    sender: "user",
                    id: crypto.randomUUID()
                }
            ];
          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(inputText);
          setChatMessages([
              ...newChatMessages, 
                {
                    message: response,
                    sender: "robot",
                    id: crypto.randomUUID()
                }
            ]);
          setInputText(''); 
        }
        return (
          <div className="chatinput-container">
            <input
              placeholder="Type your message"
              size="30"
              onChange ={saveInputText}
              value ={inputText} 
              className ="chat-input"
            />
            <button onClick ={sendMessage} className="send-button">Send</button>
          </div>
        );
      }

//ternary operator is used as an if-else statatement in the jsx. if sender = user then name it chat message user else name it chat message robot
      function ChatMessage({ message, sender }) {

        return (
          <div className={sender ==='user'? 'chat-message-user': 'chat-message-robot'}> 

            {sender === "robot" && (
              <img src="robot.png" className="chat-message-profile"/>
            )}
            <div className= "chat-message-text">
              {message}
            </div>

            {sender === "user" && (
              <img src="user.png" className="chat-message-profile"/>
            )}

          </div>
        );
      }


      function ChatMessages({chatMessages}) { //usually on top of a component and not inside any if stsateent or function
        const chatMessagesRef = React.useRef(null);
       
        React.useEffect(()=>{
          const containerElem = chatMessagesRef.current;
          if (containerElem){
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]); //runs everytime our data changes such as chatmessages and its called dependancy array
        
        return (
          <div className="chat-messages-container" ref = {chatMessagesRef}>
              {chatMessages.map((chatMessage) => {
                return (
                  <ChatMessage
                    message={chatMessage.message}
                    sender={chatMessage.sender}
                    key={chatMessage.id}
                  />
                );
              })}
          </div>
        );
      }


      function App() {
        const [chatMessages, setChatMessages] = React.useState( 
            [
                {
                    message: "hello Chatbot",
                    sender: "user",
                    id: "id1"
                },
                {
                    message: "hello how can i help?",
                    sender: "robot",
                    id: "id2"
                },
                {
                    message: "Can you get me today's date?",
                    sender: "user",
                    id: "id3"
                },
                {
                    message: "Today is September 27th.",
                    sender: "robot",
                    id: "id4"
                }
            ]
        );
        return (
          <div className="app-container"> 
            <ChatMessages 
              chatMessages={chatMessages} 
            />

            <ChatInput 
                chatMessages={chatMessages} 
                setChatMessages ={setChatMessages}
            />
          </div>
        );
      }


      const container = document.querySelector(".js-container");

      ReactDOM.createRoot(container).render(<App />);

    </script>
  </body>
</html>
