<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title> <!--React is an external library-->
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react-basics.js"></script> <!--uses a local library we created-->

    <script src="https://unpkg.com/supersimpledev/react.js"></script> <!--an external library loaded into our local file-->
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel"> 

        const button = <button> Hello World!</button> //using jsx to translate to javascript
        const paragraph = <p> Hello Kenya! </p> //cant have more elements in one variable

        const div = (
            <div>
                <button> Hello World!</button>
                <p> Hello Kenya! </p>
            </div>
        );

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(div); //render only displays one argument
    </script>
  </body>
</html>
